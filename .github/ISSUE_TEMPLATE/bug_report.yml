name: Bug report
description: Report a reproducible problem in Cascade.
title: "[Bug]: "
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: Describe what happened and how to reproduce it. Do not include student names or private data.
    - type: textarea
      id: summary
      attributes:
          label: What went wrong?
          description: Include the screen or scenario where you noticed the problem.
          placeholder: The campaign selector does not scroll after I open the settings panel.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          description: List the actions that consistently lead to the problem.
          placeholder: |-
              1. Open the campaign selector.
              2. Scroll down with the mouse wheel.
              3. Select a scenario.
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: What did you expect?
          description: Describe the result you expected to see.
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: What happened instead?
      validations:
          required: true
    - type: input
      id: browser
      attributes:
          label: Browser and version
          placeholder: Edge 130, Chrome 130, Firefox 131
    - type: input
      id: viewport
      attributes:
          label: Window size or device
          placeholder: 1440 by 900 desktop, or tablet model
    - type: textarea
      id: evidence
      attributes:
          label: Screenshot or console message
          description: Attach a screenshot or paste the relevant browser console message. Remove private information first.
